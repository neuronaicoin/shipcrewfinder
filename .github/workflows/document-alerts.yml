name: Document Expiry Alerts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger document expiry check
        run: |
          curl -f -X GET "https://shipcrewfinder.com/api/cron/document-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
